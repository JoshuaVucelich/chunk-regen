name: Cleanup bootstrap
on:
  push:
    branches:
      - bootstrap
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove bootstrap branch'
    runs-on: ubuntu-latest
    steps:
      - name: Point the repo at main and delete bootstrap
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"default_branch":"main"}')
          echo "$resp"
          echo "::notice title=default-branch::$resp"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("default_branch")=="main", d' <<<"$resp"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" :refs/heads/bootstrap
