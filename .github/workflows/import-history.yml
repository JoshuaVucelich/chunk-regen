name: Retarget bootstrap
on:
  push:
    branches:
      - bootstrap
permissions:
  contents: write
jobs:
  retarget:
    if: github.event.head_commit.message == 'Retarget bootstrap to main'
    runs-on: ubuntu-latest
    steps:
      - name: Move bootstrap onto the real main commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            f3d2506679b0cab6acff18d06b67b667d67e7049:refs/heads/bootstrap
          git ls-remote "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/bootstrap refs/heads/main
