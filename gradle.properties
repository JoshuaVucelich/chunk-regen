# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
# 26.2.0.89 is the newest stable NeoForge for 26.2. 26.3 is still beta, so this port stays on 26.2.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.89

# Mod Properties
mod_id=chunk-regen
mod_name=Chunk Regen
mod_license=CC0-1.0
mod_version=1.1.0+26.2-neoforge
mod_group_id=com.vwsdigital.chunkregen
